<script>
const ITER=300000;
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const msg=document.getElementById('msg'), btn=document.getElementById('b'), pw=document.getElementById('pw').value;
  btn.disabled=true; msg.textContent='Decrypting…';
  try{
    const raw=Uint8Array.from(atob(document.getElementById('blob').textContent.trim()),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    const html=new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(err){ msg.textContent='That passphrase did not work.'; btn.disabled=false; }
});
</script>
